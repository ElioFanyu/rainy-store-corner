<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>雨夜便利店 · 街角微缩模型</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05070d;
      overflow: hidden;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    /* 只有暗角，没有可交互界面 */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(120% 100% at 50% 42%, rgba(4, 7, 13, 0) 38%, rgba(4, 7, 13, 0.42) 72%, rgba(2, 4, 8, 0.86) 100%);
      mix-blend-mode: multiply;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
